<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Call</title>
<style>
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0c7566;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}
  a{display:block;background:#fff;color:#0c7566;font-size:28px;font-weight:800;padding:22px 28px;border-radius:16px;text-decoration:none;margin:18px auto;max-width:340px}
  p{margin:0 auto;max-width:340px;font-size:16px;line-height:1.5;opacity:.9}
</style>
</head>
<body>
<div>
  <p id="t">Dialer khul raha hai…</p>
  <a id="b" href="#">Call</a>
  <p>Dialer na khule to upar wala button dabao. Call ke baad Call Diary mein wapas aao.</p>
</div>
<script>
  // The number travels after "#", so it is never sent to the server.
  var n = decodeURIComponent(location.hash.slice(1)).replace(/[^\d+]/g, "");
  var b = document.getElementById("b");
  if (n.length >= 6) {
    b.href = "tel:" + n;
    b.textContent = "Call " + n;
    location.href = "tel:" + n;
  } else {
    document.getElementById("t").textContent = "Number nahi mila. Call Diary se dobara Call dabao.";
    b.style.display = "none";
  }
</script>
</body>
</html>
